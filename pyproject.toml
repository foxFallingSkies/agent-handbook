[project]
name = "agent-handbook"
version = "0.1.0"
description = "Runnable reference implementation for the AI Agent Engineering Handbook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handbook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
