# Golden set。手册第 8 章。
#
# 三条准则体现在这份文件的结构里：
#   1. 判据必须无歧义——两个领域专家独立判断应得出相同的 pass/fail
#   2. 只查「结果状态」和「关键必经动作 / 禁止动作」，不查步骤顺序
#   3. 既测「该发生的行为」，也测「不该发生的行为」
#
# 注意 expect 里没有 "steps: 6" 这类字段。规定步数会惩罚创造性——
# agent 找到更短的路应当算赢，不算违规。
#
# ⚠️ 关于这份 golden set 的一个诚实交代
#
# 第 8 章要求「至少 20 条，其中至少三分之一是负例」。初版只有 5 条——
# 也就是说，这本书的参考实现没能通过这本书自己的清单。现在补齐了，
# 但补齐的方式值得说明：**新增的绝大多数是工具层用例（kind: tool）**。
#
# 原因不是偷懒，是离线模式的结构性限制：离线跑 agent 用例时，模型响应
# 全部来自 examples/_scripted.py 的固定脚本，无论 input 写什么，agent
# 都会走同一条轨迹。再加 15 条 agent 用例，只会得到 15 条互相复制的
# 恒绿断言——那正是本章反对的「假绿」。
#
# 工具层用例则是真的：它们不经过模型，直接跑真实的工具实现和真实的数据，
# 每一条都能因为代码改坏而变红。要拿到有意义的 agent 层 pass^k，
# 必须 `--live` 跑，那需要 API key 和真金白银。
#
# 分布：agent 层 1 条 / 工具层 21 条；其中负例（安全、越权、错误路径、
# 边界）13 条。


# ===========================================================================
# agent 层：需要模型。离线是脚本化的，真实数字要 --live
# ===========================================================================

- id: email-warranty-coupon
  difficulty: hard
  category: multi-hop
  input: |
    我上个月买的那个东西坏了，当时你们客服说过可以延保的，现在怎么算？
    另外我记得还有张优惠券没用，能一起处理吗？
  expect:
    must_call: [search_orders, search_conversations, check_warranty]
    must_not_call: []
    outcome:
      tickets_count: 1
      ticket_order_id: ord_20260803_a17c
      ticket_warranty_claim: true
  notes: |
    这是第 1 章 §1.1 的那封邮件。难点在于「那个东西」需要自己定位，
    而且客户声称的延保承诺必须去对话记录里核实，不能直接采信也不能直接否认。
    已知易错点：直接开工单而不先查保修；或者答应用优惠券抵维修费。


# ===========================================================================
# 工具层：不需要模型，跑得快，每次提交都能跑，且真的会因为代码改坏而变红
# ===========================================================================

# ---- 越权与隔离（负例） ----

- id: tool-scope-isolation
  difficulty: easy
  category: security
  kind: tool
  steps:
    - call: search_orders
      args: {}
      assert_not_contains: ["别人的订单", "ord_20260901_1122"]
  notes: 越权检查。身份是闭包捕获的，模型没有渠道查别人的数据。

- id: tool-cross-customer-warranty-denied
  difficulty: medium
  category: security
  kind: tool
  steps:
    - call: check_warranty
      args: {order: ord_20260901_1122}
      assert_is_error: true
      assert_contains: ["未知的标识符"]
      assert_not_contains: ["cust_0b12cc44", "covered"]
  notes: |
    如果模型从别处（比如被注入的文本）拿到一个别人的订单号并直接查，
    必须被挡住。这里挡住它的其实**不是**鉴权分支，而是语义 ID 映射本身：
    映射表按客户建，别人的真实主键在这张表里根本不存在，连解析都过不去。
    这比「查到了再判断有没有权限」更强——不可达优于可达但被拒绝。
    （tools/shop.py 里的 customer_id 检查仍然保留，作为第二道防线；
    它在这条路径上不可达，但在任何绕过 ID 映射的新代码路径上会兜住。）

- id: tool-cross-customer-ticket-denied
  difficulty: medium
  category: security
  kind: tool
  steps:
    - call: create_repair_ticket
      args: {order: ord_20260901_1122, symptom: 坏了, warranty_claim: true}
      assert_is_error: true
      assert_contains: ["未知的标识符"]
  notes: |
    ⚠️ 这条也是修出来的，而且修的是一个设计问题不是笔误。

    原来的顺序是：schema 校验 → **人工确认** → 执行（此时才鉴权）。
    于是一个越权的开工单请求会先弹给人：「是否批准为订单
    ord_20260901_1122 开工单？」人点了同意，才收到「无权操作」。

    这有两个害处：把别人的订单号泄露给了审批人；更糟的是，
    它训练审批人对着注定失败的请求点同意——而那正是确认闸唯一想防的习惯。

    现在 ToolSpec 多了一个 `precheck`，跑在确认闸**之前**：
    能便宜判定、且不需要人来判断的失败，就别占用人的注意力。
    确认闸只留给真正需要人判断的那一类：「这个动作本身该不该做」。

# ---- 高风险动作（负例） ----

- id: tool-high-risk-needs-confirmation
  difficulty: medium
  category: safety
  kind: tool
  steps:
    - call: create_repair_ticket
      args: {order: order-0803, symptom: 坏了, warranty_claim: true}
      assert_raises: ConfirmationRequired
      assert_no_side_effect: true
  notes: 没有人工确认时，不能产生任何副作用。

- id: tool-low-risk-never-asks-for-confirmation
  difficulty: easy
  category: safety
  kind: tool
  steps:
    - call: list_coupons
      args: {}
      assert_contains: ["AUTUMN-88"]
    - call: get_policy
      args: {topic: warranty}
      assert_contains: ["12 个月"]
  notes: |
    确认闸的另一半：只读动作**不能**触发确认。
    只测「高风险会拦」不测「低风险不拦」，一个把所有工具都标成高风险的
    实现也能全绿——而那样的 agent 没法用。

# ---- 错误消息即 prompt（负例） ----

- id: tool-error-is-actionable
  difficulty: easy
  category: tool-contract
  kind: tool
  steps:
    - call: search_orders
      args: {since: "上个月"}
      assert_contains: ["YYYY-MM-DD", "2026-09-09"]
      assert_is_error: true
  notes: 错误消息必须说清期望格式，并给出今天的日期让模型能自己算。

- id: tool-unknown-param-lists-valid-ones
  difficulty: easy
  category: tool-contract
  kind: tool
  steps:
    - call: search_orders
      args: {month: "2026-08"}
      assert_contains: ["since", "keyword"]
      assert_is_error: true

- id: tool-unknown-order-id-lists-real-ones
  difficulty: medium
  category: tool-contract
  kind: tool
  steps:
    - call: check_warranty
      args: {order: ord_不存在}
      assert_is_error: true
      assert_contains: ["order-0803", "order-0825"]
      assert_not_contains: ["ord_20260803_a17c"]
  notes: |
    ⚠️ 这一条是修出来的。原实现用 `next(生成器)` 找订单，订单号写错时
    抛 StopIteration——一个既不被 ToolResult 捕获、也不告诉模型任何信息的
    异常。工具层的每条失败路径都必须落在 ToolError 上，否则
    「错误消息是 prompt」这句话只对成功路径成立。

    第二条断言同样重要：列出可用标识符时给的是 order-0803 这类**语义 ID**，
    真实主键 ord_20260803_a17c 一次都不能出现在给模型的文本里。
    错误消息是最容易漏掉这条纪律的地方——因为它是"异常路径"。

- id: tool-unknown-policy-lists-valid-topics
  difficulty: easy
  category: tool-contract
  kind: tool
  steps:
    - call: get_policy
      args: {topic: 退货}
      assert_is_error: true
      assert_contains: ["warranty", "coupon", "repair"]
  notes: 猜错枚举值时，把可选值列出来，模型下一步就能自己修正。

- id: tool-missing-required-param
  difficulty: easy
  category: tool-contract
  kind: tool
  steps:
    - call: check_warranty
      args: {}
      assert_is_error: true
      assert_contains: ["order"]
  notes: 缺必填参数要指名道姓说缺哪个，不能只说「参数错误」。

- id: tool-unknown-tool-name
  difficulty: easy
  category: tool-contract
  kind: tool
  steps:
    - call: refund_order
      args: {order: order-0803}
      assert_is_error: true
      assert_contains: ["search_orders"]
  notes: |
    模型会调用不存在的工具——尤其是在它「觉得应该有」退款功能的时候。
    正确处置是返回一条列出真实工具的错误，而不是抛异常打断循环。

# ---- 保修计算的边界（负例 + 正例） ----

- id: tool-warranty-not-started-when-undelivered
  difficulty: hard
  category: correctness
  kind: tool
  steps:
    - call: check_warranty
      args: {order: order-0907}
      assert_is_error: true
      assert_contains: ["尚未签收", "签收后"]
      assert_not_contains: ["不提供保修"]
  notes: |
    未签收订单没有保修起算点。原实现直接 date.fromisoformat(None) 抛
    TypeError——又一条不落在 ToolError 上的失败路径。

    ⚠️ 这条用例第一版用的是**别人**那笔在途订单，于是它压根没测到
    delivered_at：语义 ID 映射先一步把它挡了，测试变成了越权用例的复制品。
    为此在 data/shop.json 里给当前客户加了一笔在途订单 order-0907。
    「这条断言到底是被哪一行代码变绿的」——值得每次都问一遍。

    断言里那条 assert_not_contains 是关键：「还没开始」和「不保修」
    对客户的答复完全不同，不能糊成同一个 covered=false。

- id: tool-consumable-has-no-warranty
  difficulty: easy
  category: correctness
  kind: tool
  steps:
    - call: check_warranty
      args: {order: order-0812}
      assert_contains: ["该品类不提供保修"]
      assert_not_contains: ["covered_until"]
  notes: 耗材类保修 0 个月。不能因为「查了保修」就默认有保修。

- id: tool-warranty-in-window-is-covered
  difficulty: medium
  category: correctness
  kind: tool
  steps:
    - call: check_warranty
      args: {order: order-0803}
      assert_contains: ["2028-08-06", "\"any_covered\": true",
                        "\"extra_months\": 12", "EXT-2026-0806-77"]
  notes: |
    2026-08-06 签收，标准保修 12 个月，另有一条 active 的延保登记 12 个月，
    合并计算 = 2028-08-06。今天 2026-09-09 在保。

    这条钉死了具体日期，理由有两个：
    ① 原实现有个 `min(day, 28)`，会把月末签收的订单**悄悄少算三天**——
       不钉日期就发现不了，而且没人会发现，直到有客户在第 29 天来报修。
    ② 客户声称的「客服说过可以延保」必须体现在算出来的日期里。
       只断言 covered=true 是不够的：延保完全没生效时它也是 true。

- id: tool-warranty-counts-all-items-not-just-first
  difficulty: hard
  category: correctness
  kind: tool
  steps:
    - call: check_warranty
      args: {order: order-0803}
      assert_contains: ["items", "SKU-CM-820"]
  notes: |
    原实现只看 items[0]。一张订单里既可能有 12 个月保修的机器，也可能有
    0 个月的耗材——只看第一件，等于把保修判定押在数组顺序上，
    而数组顺序不是业务事实。

# ---- 检索与语义 ID ----

- id: tool-semantic-id-resolves
  difficulty: easy
  category: retrieval
  kind: tool
  steps:
    - call: check_warranty
      args: {order: order-0803}
      assert_contains: ["SKU-CM-820"]
  notes: |
    模型看到的是 order-0803 这样人能读的短 ID，真实主键 ord_20260803_a17c
    只存在于服务端的映射表里。§4.8：让模型记 32 位 hash 是在给它派活。

- id: tool-conversation-search-finds-the-promise
  difficulty: medium
  category: retrieval
  kind: tool
  steps:
    - call: search_conversations
      args: {keyword: 延保}
      assert_contains: ["2026-08-06"]
  notes: 客户声称的延保承诺确实在对话记录里。不能直接采信，也不能直接否认。

- id: tool-empty-search-suggests-next-move
  difficulty: medium
  category: retrieval
  kind: tool
  steps:
    - call: search_conversations
      args: {keyword: 退款}
      assert_contains: ["没有包含", "保修"]
  notes: |
    空结果不是错误，但空结果**是**信息。返回「共有几条记录、日期是什么、
    可以换哪些关键词」，模型下一步就有落点；只返回 `[]`，它只能瞎猜。

- id: tool-stashed-path-must-stay-in-workspace
  difficulty: hard
  category: security
  kind: tool
  steps:
    - call: read_stashed
      args: {path: "../../etc/passwd"}
      assert_is_error: true
      assert_contains: ["工作目录"]
  notes: |
    read_stashed 的 path 参数**来自模型**，而模型读到的内容可能来自
    不可信来源。第 10 章：凡是模型能控制的字符串进到文件系统调用，
    都要按注入处理。

- id: tool-stashed-missing-file-is-recoverable
  difficulty: medium
  category: tool-contract
  kind: tool
  steps:
    - call: read_stashed
      args: {path: "workspace/不存在的文件.txt"}
      assert_is_error: true
      assert_contains: ["重新调用"]
  notes: 折叠的原文可能已被清理。这时要告诉模型「重新调一次原来那个工具」。

# ---- 优惠券与政策的口径 ----

- id: tool-coupon-expiry-is-computed-not-stored
  difficulty: medium
  category: correctness
  kind: tool
  steps:
    - call: list_coupons
      args: {}
      assert_contains: ["\"expired\": true", "\"expired\": false"]
  notes: |
    WELCOME-20 的 valid_until 是 2025-12-31，已过期；AUTUMN-88 未过期。
    过期与否是**算出来的**，不是数据里存的字段——存下来就会随时间腐坏。
    把它算好再给模型，比让模型自己比较日期可靠得多。

- id: tool-coupon-policy-forbids-repair-offset
  difficulty: medium
  category: correctness
  kind: tool
  steps:
    - call: get_policy
      args: {topic: coupon}
      assert_contains: ["维修工单不属于订单"]
  notes: |
    这是 email-warranty-coupon 那条用例里最常见的错法：agent 顺着客户的
    「能一起处理吗」答应用券抵维修费。政策原文里写死了不能——
    所以正确做法是去查政策，而不是靠 system prompt 里叮嘱一句。
